<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Pasar 5 Produk Kampus - Lab Pemrograman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6 max-w-5xl mx-auto">
  <header class="mb-8 border-b pb-4">
    <span class="text-xs font-bold uppercase tracking-wider bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Eksperimen Product-Market Fit</span>
    <h1 class="text-3xl font-bold mt-2">Pilih Layanan Kampus yang Paling Kamu Butuhkan</h1>
    <p class="text-slate-600 mt-1">Klik pada layanan yang ingin kamu gunakan. Metrik minat dan traffic dicatat secara otomatis.</p>
    <div id="utm-banner" class="mt-3 text-xs font-mono bg-slate-200 p-2 rounded"></div>
  </header>
  <div id="product-grid" class="grid md:grid-cols-3 gap-5 mb-10"></div>
  <section class="bg-white border rounded-xl p-5 shadow-sm">
    <h2 class="font-bold text-lg mb-3">Dasbor Metrik Minat & Traffic</h2>
    <table class="w-full text-sm text-left border-collapse">
      <thead><tr class="bg-slate-100 border-b"><th class="p-2">Kode</th><th class="p-2">Produk</th><th class="p-2 text-right">Klik Minat</th><th class="p-2 text-right">CTR</th></tr></thead>
      <tbody id="metrics-table"></tbody>
    </table>
  </section>
  <script>
    const products = [
      { id: 'P1', name: 'JasaKu Express', desc: 'Kurir instan & titip beli area kos Tembalang tarif flat Rp5.000.', tag: 'Logistik' },
      { id: 'P2', name: 'NebengKampus', desc: 'Cari tumpangan searah ke kampus bareng mahasiswa terverifikasi.', tag: 'Mobilitas' },
      { id: 'P3', name: 'LaundryTrack', desc: 'Jemput-antar laundry kos dengan pelacakan status cucian real-time.', tag: 'Kebutuhan Kos' },
      { id: 'P4', name: 'SplitKatering', desc: 'Langganan makan harian mahasiswa yang bisa di-pause kapan saja.', tag: 'F&B' },
      { id: 'P5', name: 'SewaAlatKampus', desc: 'Sewa proyektor, kamera, dan HT untuk kepanitiaan kampus.', tag: 'Event' }
    ];
    const params = new URLSearchParams(window.location.search);
    const visits = parseInt(localStorage.getItem('total_visits') || '0') + 1;
    localStorage.setItem('total_visits', visits);
    document.getElementById('utm-banner').textContent = `Sumber Traffic: ${params.get('utm_source') || 'organik'} | Total Kunjungan: ${visits}x`;
    function render() {
      const grid = document.getElementById('product-grid'), tbody = document.getElementById('metrics-table');
      grid.innerHTML = ''; tbody.innerHTML = '';
      products.forEach(p => {
        const clicks = parseInt(localStorage.getItem('clicks_' + p.id) || '0');
        const ctr = ((clicks / visits) * 100).toFixed(1);
        grid.innerHTML += `<div class="bg-white border rounded-xl p-5 shadow-sm flex flex-col justify-between"><div><span class="text-xs font-semibold text-blue-700 bg-blue-50 px-2 py-1 rounded">${p.tag}</span><h3 class="font-bold text-lg mt-2">${p.id} - ${p.name}</h3><p class="text-sm text-slate-600 mt-1 mb-4">${p.desc}</p></div><button onclick="track('${p.id}')" class="w-full bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm">Saya Tertarik (${clicks})</button></div>`;
        tbody.innerHTML += `<tr class="border-b"><td class="p-2 font-mono font-bold">${p.id}</td><td class="p-2">${p.name}</td><td class="p-2 text-right font-bold">${clicks}</td><td class="p-2 text-right font-mono">${ctr}%</td></tr>`;
      });
    }
    function track(id) { localStorage.setItem('clicks_' + id, parseInt(localStorage.getItem('clicks_' + id) || '0') + 1); render(); }
    render();
  </script>
</body>
</html>
